<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b14" />
    <meta
      name="description"
      content="Alpha trading command center for portfolio, agent fleet, fundamentals, and infrastructure health."
    />
    <title>Alpha · Trading Command Center</title>
    <script>
      (() => {
        const dark = localStorage.getItem('alpha-theme') !== 'light'
        document.documentElement.classList.toggle('dark', dark)
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#070b14' : '#f4f7fb')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
