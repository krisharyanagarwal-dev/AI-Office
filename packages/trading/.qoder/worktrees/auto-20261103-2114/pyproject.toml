[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-trading-system"
version = "0.1.0"
description = "Multi-brain regime-adaptive trading system with factor/ML models"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "Aryan Agarwal", email = "aryanagarwal12@example.com"}
]
keywords = ["trading", "quantitative", "factor-investing", "machine-learning", "regime-detection", "trading-bot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
dependencies = [
    "yfinance>=0.2.40",
    "lightgbm>=4.3.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "websocket-client>=1.6.0",
    "pandas-ta>=0.3.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "ipykernel>=6.25.0",
    "jupyter>=1.0.0",
    "nbconvert>=7.0.0",
]
live = [
    "ib_insync>=0.9.76",
    "binance-connector>=1.0.1",
    "ccxt>=4.2.110",
    "alpaca-py>=0.14.0",
]
notebook = [
    "seaborn>=0.13.0",
    "plotly>=5.17.0",
    "ipywidgets>=8.1.0",
    "tqdm>=4.65.0",
]

[project.urls]
Homepage = "https://github.com/aryanagarwal12/alpha-trading-system"
Documentation = "https://github.com/aryanagarwal12/alpha-trading-system#readme"
Repository = "https://github.com/aryanagarwal12/alpha-trading-system"
Issues = "https://github.com/aryanagarwal12/alpha-trading-system/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["alpha*"]

[tool.setuptools.package-data]
alpha = ["*.yaml", "*.yml"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
select = ["E", "F", "W", "C90"]
ignore = []
line-length = 88
target-version = "py38"
extend-exclude = [
    "migrations",
    "node_modules",
    ".git",
    "__pycache__",
    "build",
    "dist"
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "silent"
show_error_codes = true
show_error_end = true
strict_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
files = "alpha/**/*.py"
exclude = "tests"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
