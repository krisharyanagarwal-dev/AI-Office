[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "office-shared"
version = "0.1.0"
description = "Shared utilities for AI-Office packages"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prometheus-client>=0.19",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["python"]
include = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
