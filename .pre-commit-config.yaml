repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: [-r, engine/, tasks/]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: python
        pass_filenames: false
        args: [-x, '-q', '--tb=short']
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: mypy-check
        name: mypy-check
        entry: python3 -m mypy --config-file mypy.ini api/ engine/ tasks/ calibration/
        language: python
        pass_filenames: false
        stages: [pre-commit]
